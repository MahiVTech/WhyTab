<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>WhyTab • History</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      📘 <span>WhyTab</span>
    </div>

    <nav>
      <a class="active">📜 History</a>
      <a href="settings.html">⚙️ Settings</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content">

    <!-- Top App Bar -->
    <header class="history-appbar">
      <div class="app-left">
        <span class="logo">📘 WhyTab</span>
      </div>

      <div class="app-right">
        <button id="themeToggle" class="icon-btn">🌙</button>
        <a href="settings.html" class="icon-btn">⚙️</a>
      </div>
    </header>

    <!-- Dashboard -->
    <section class="history-dashboard">

      <!-- Insights -->
      <section id="insightsBox" class="glass-card"></section>

      <section id="statsBox" class="stats-grid"></section>

      <!-- Charts -->
<section id="chartsBox" class="glass-card">
  <h4>📊 Usage Breakdown</h4>
  <div class="pie-wrapper">
    <div id="pieChart" class="pie"></div>
    <div id="pieLegend" class="pie-legend"></div>
  </div>
</section>

      <!-- Saved Tabs -->
      <section class="tabs-section">
        <h3 class="section-title">Saved Tabs</h3>
        <div id="historyList" class="tabs-grid"></div>
      </section>

    </section>

  </main>
</div>

<script src="history.js"></script>
</body>
</html>
